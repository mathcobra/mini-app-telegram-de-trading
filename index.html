<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V30 DEBUG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;padding:12px;max-width:420px;margin:0 auto}
.header{text-align:center;padding:12px 0;border-bottom:2px solid #e94560;margin-bottom:12px}
.header h1{color:#e94560;font-size:20px}
.header p{color:#8b949e;font-size:11px}
.debug-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:12px;font-size:11px;line-height:1.8}
.debug-box h3{color:#e94560;font-size:13px;margin-bottom:8px}
.status-line{padding:4px 0;border-bottom:1px solid #21262d}
.status-ok{color:#3fb950;font-weight:600}
.status-ko{color:#f85149;font-weight:600}
.status-warn{color:#d29922}
.btn{border:none;border-radius:12px;padding:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;width:100%;margin-bottom:8px}
.btn-green{background:#238636}
.btn-red{background:#da3633}
.btn-blue{background:#1f6feb}
.btn-orange{background:#d29922;color:#000}
#console{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px;font-size:10px;line-height:1.6;max-height:200px;overflow-y:auto;font-family:monospace}
#console .ok{color:#3fb950}
#console .err{color:#f85149}
#console .info{color:#58a6ff}
</style>
<base target="_blank">
</head>
<body>

<div class="header">
  <h1>🐛 V30 DEBUG MODE</h1>
  <p>Mode diagnostic — les erreurs s'affichent ci-dessous</p>
</div>

<div class="debug-box">
  <h3>📋 État Telegram WebApp</h3>
  <div id="tgStatus"></div>
</div>

<div class="debug-box">
  <h3>🧪 Tests</h3>
  <button class="btn btn-green" onclick="testSendData()">TEST 1: Envoyer START</button>
  <button class="btn btn-blue" onclick="testMainButton()">TEST 2: MainButton</button>
  <button class="btn btn-orange" onclick="testFallback()">TEST 3: Fallback URL</button>
  <button class="btn btn-red" onclick="clearConsole()">Effacer logs</button>
</div>

<div class="debug-box">
  <h3>🖥️ Console JavaScript</h3>
  <div id="console"></div>
</div>

<script>
// ==========================================
// CONSOLE CUSTOM
// ==========================================
function log(msg, type) {
    const div = document.getElementById('console');
    const now = new Date().toLocaleTimeString();
    const cls = type === 'err' ? 'err' : type === 'ok' ? 'ok' : 'info';
    div.innerHTML += '<div class="' + cls + '">[' + now + '] ' + msg + '</div>';
    div.scrollTop = div.scrollHeight;
    console.log('[V30]', msg);
}

function clearConsole() {
    document.getElementById('console').innerHTML = '';
}

// ==========================================
// INIT
// ==========================================
log('=== V30 DEBUG CHARGÉ ===', 'info');

// Vérifier si le script Telegram est chargé
if (typeof window.Telegram === 'undefined') {
    log('❌ window.Telegram est UNDEFINED', 'err');
    document.getElementById('tgStatus').innerHTML = '<div class="status-ko">❌ Script Telegram non chargé</div>';
} else {
    log('✅ window.Telegram existe', 'ok');
}

const tg = window.Telegram.WebApp;

// ==========================================
// VÉRIFICATIONS
// ==========================================
const statusDiv = document.getElementById('tgStatus');
let html = '';

// 1. tg existe?
if (tg) {
    html += '<div class="status-ok">✅ tg = WebApp chargé</div>';
    log('✅ tg = WebApp', 'ok');
} else {
    html += '<div class="status-ko">❌ tg = WebApp NULL</div>';
    log('❌ tg = WebApp NULL', 'err');
}

// 2. tg.initDataUnsafe?
if (tg.initDataUnsafe) {
    html += '<div class="status-ok">✅ initDataUnsafe existe</div>';
    log('✅ initDataUnsafe OK', 'ok');
    log('   user_id: ' + (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'N/A'), 'info');
} else {
    html += '<div class="status-ko">❌ initDataUnsafe NULL</div>';
    log('❌ initDataUnsafe NULL', 'err');
}

// 3. tg.sendData?
if (typeof tg.sendData === 'function') {
    html += '<div class="status-ok">✅ sendData() est une fonction</div>';
    log('✅ sendData() = fonction', 'ok');
} else {
    html += '<div class="status-ko">❌ sendData() NON disponible</div>';
    log('❌ sendData() = ' + typeof tg.sendData, 'err');
}

// 4. tg.MainButton?
if (tg.MainButton) {
    html += '<div class="status-ok">✅ MainButton existe</div>';
    log('✅ MainButton OK', 'ok');
} else {
    html += '<div class="status-ko">❌ MainButton NULL</div>';
    log('❌ MainButton NULL', 'err');
}

// 5. Version
html += '<div class="status-warn">ℹ️ Version: ' + (tg.version || 'N/A') + '</div>';
html += '<div class="status-warn">ℹ️ Platform: ' + (tg.platform || 'N/A') + '</div>';
log('ℹ️ Version: ' + tg.version, 'info');
log('ℹ️ Platform: ' + tg.platform, 'info');

statusDiv.innerHTML = html;

// Expand
try {
    tg.expand();
    tg.ready();
    log('✅ tg.expand() + ready() OK', 'ok');
} catch(e) {
    log('❌ Erreur expand/ready: ' + e.message, 'err');
}

// ==========================================
// TEST 1: sendData direct
// ==========================================
function testSendData() {
    log('--- TEST 1: sendData ---', 'info');
    const payload = JSON.stringify({action: 'start', test: true});
    log('Payload: ' + payload, 'info');

    try {
        log('Appel tg.sendData()...', 'info');
        tg.sendData(payload);
        log('✅ sendData() exécuté (la fenêtre devrait se fermer)', 'ok');
    } catch(e) {
        log('❌ ERREUR sendData: ' + e.message, 'err');
        log('   Stack: ' + e.stack, 'err');
    }
}

// ==========================================
// TEST 2: MainButton
// ==========================================
function testMainButton() {
    log('--- TEST 2: MainButton ---', 'info');

    try {
        tg.MainButton.setText('🚀 ENVOYER START');
        tg.MainButton.setParams({color: '#238636', text_color: '#ffffff'});
        tg.MainButton.show();
        log('✅ MainButton affiché', 'ok');

        tg.MainButton.onClick(function() {
            log('MainButton cliqué!', 'ok');
            const payload = JSON.stringify({action: 'start', via: 'mainbutton'});
            try {
                tg.sendData(payload);
                log('✅ sendData via MainButton OK', 'ok');
            } catch(e) {
                log('❌ Erreur: ' + e.message, 'err');
            }
        });
        log('✅ onClick attaché', 'ok');
    } catch(e) {
        log('❌ ERREUR MainButton: ' + e.message, 'err');
    }
}

// ==========================================
// TEST 3: Fallback (si sendData ne marche pas)
// ==========================================
function testFallback() {
    log('--- TEST 3: Fallback ---', 'info');
    log('Si sendData ne marche pas, utilise les commandes texte:', 'info');
    log('/start /stop /reset dans Telegram', 'info');
}

// ==========================================
// GESTION ERREURS GLOBALES
// ==========================================
window.onerror = function(msg, url, line, col, error) {
    log('❌ JS ERROR: ' + msg + ' (ligne ' + line + ')', 'err');
    return false;
};

window.addEventListener('unhandledrejection', function(e) {
    log('❌ PROMISE REJECTED: ' + e.reason, 'err');
});

log('=== INIT TERMINÉ ===', 'info');
</script>
</body>
</html>
